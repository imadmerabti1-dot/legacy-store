<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">LEGACY blue purple wordmark</title>
  <desc id="desc">A modern LEGACY wordmark with electric blue and ultraviolet accent.</desc>
  <defs>
    <linearGradient id="legacyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <text x="700" y="198" text-anchor="middle" fill="#0B1020" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-size="164" font-weight="600" letter-spacing="14" textLength="1160" lengthAdjust="spacingAndGlyphs">LEGACY</text>
  <rect x="1240" y="91" width="24" height="24" fill="url(#legacyGradient)"/>
